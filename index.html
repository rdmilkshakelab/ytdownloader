<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTDownloader</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --container-bg: #1f1f1f;
            --accent-color: #ff0000;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --input-bg: #2d2d2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 20px;
        }

        h1 span {
            color: var(--accent-color);
        }

        .input-group {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid transparent;
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #cc0000;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 20px;
        }

        .result-card {
            display: none;
            margin-top: 25px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 8px;
            text-align: left;
        }

        .video-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .download-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .dl-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background-color: #333;
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .dl-btn:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span>Stream</span>Fetch</h1>
    <p style="color: var(--text-secondary); margin-bottom: 25px;">Enter a YouTube video URL to fetch high-quality download links directly to this device.</p>
    
    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="https://youtube.com..." autocomplete="off">
        <button id="fetchBtn" onclick="fetchVideo()">Fetch</button>
    </div>

    <div class="status" id="statusMessage"></div>

    <div class="result-card" id="resultCard">
        <div class="video-title" id="videoTitle">Video Title Loading...</div>
        <div class="download-options">
            <a href="#" id="mp4Btn" class="dl-btn" target="_blank" rel="noopener noreferrer">Download Video (MP4)</a>
            <a href="#" id="mp3Btn" class="dl-btn" style="background-color: #444;" target="_blank" rel="noopener noreferrer">Download Audio (MP3)</a>
        </div>
    </div>
</div>

<script>
    async function fetchVideo() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const statusMessage = document.getElementById('statusMessage');
        const resultCard = document.getElementById('resultCard');
        const videoTitle = document.getElementById('videoTitle');
        const mp4Btn = document.getElementById('mp4Btn');
        const mp3Btn = document.getElementById('mp3Btn');

        if (!urlInput) {
            statusMessage.innerText = "⚠️ Please paste a valid YouTube URL first.";
            return;
        }

        // Basic validation for YouTube URL patterns
        if (!urlInput.includes('://youtube.com') && !urlInput.includes('youtu.be/')) {
            statusMessage.innerText = "⚠️ Not a valid YouTube URL structure.";
            return;
        }

        statusMessage.innerText = "🔍 Contacting converter API... Please wait...";
        resultCard.style.display = "none";

        try {
            // Using a reliable public API framework endpoint for static frontend extraction
            const apiEndpoint = `https://cobalt.tools`;
            
            const response = await fetch(apiEndpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    url: urlInput,
                    vQuality: "720", // Standard mobile/TV tier
                    filenamePattern: "basic"
                })
            });

            const data = await response.json();

            if (data && data.url) {
                statusMessage.innerText = "✅ Link successfully generated!";
                videoTitle.innerText = "Your Media File is Ready";
                
                // Assign the direct payload download stream URL to the layout anchors
                mp4Btn.href = data.url;
                
                // Fallback secondary audio pipeline conversion link
                mp3Btn.href = data.url + "&isAudio=true"; 
                
                resultCard.style.display = "block";
            } else {
                throw new Error(data.text || "Unknown API parsing anomaly.");
            }

        } catch (error) {
            console.error(error);
            statusMessage.innerText = "❌ Failed to fetch stream. The video may be restricted, or the API gateway is ratelimited.";
        }
    }
</script>

</body>
</html>
